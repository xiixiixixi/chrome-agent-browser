<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>AB-E2E 测试页</title></head>
<body>
  <h1 id="title">chrome-agent-browser e2e</h1>
  <label for="name">姓名</label>
  <input id="name" data-testid="name-input" placeholder="输入姓名" autocomplete="off">
  <button id="btn" data-testid="submit-btn" role="button" aria-label="提交">点我</button>
  <a id="link" href="#done" aria-label="链接甲">链接甲</a>
  <div id="out" role="status" aria-live="polite"></div>
  <script>
    // 页面被真实点击/填写后改变状态，供 E2E 断言“操作真的发生了”
    document.getElementById('btn').addEventListener('click', () => {
      const v = document.getElementById('name').value || '(空)';
      document.getElementById('out').textContent = 'clicked:' + v;
    });
    window.__e2eMarker = 'loaded';
  </script>
  <script>
    // WebMCP 工具声明（按 2026 WebMCP 页面 JS API：document.modelContext.registerTool）。
    // document.modelContext 仅在浏览器开实验开关（--enable-experimental-web-platform-features）
    // 时存在；未启用时静默跳过，页面其余功能不受影响（E2E 的 webmcp 用例据此条件跳过）。
    (function () {
      if (!document.modelContext || typeof document.modelContext.registerTool !== 'function') return;
      document.modelContext.registerTool({
        name: 'ab_echo',
        description: '回显消息（只读探测工具）',
        inputSchema: { type: 'object', properties: { msg: { type: 'string' } }, required: ['msg'] },
        async execute({ msg }) { return { content: [{ type: 'text', text: 'echo:' + msg }] }; }
      }).catch(() => {});
      document.modelContext.registerTool({
        name: 'ab_set_status',
        description: '把页面状态文本设为给定值（非只读）',
        inputSchema: { type: 'object', properties: { text: { type: 'string' } }, required: ['text'] },
        async execute({ text }) {
          document.getElementById('out').textContent = 'webmcp:' + text;
          return { content: [{ type: 'text', text: 'set' }] };
        }
      }).catch(() => {});
    })();
  </script>
</body>
</html>
